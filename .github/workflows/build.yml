name: Build & Test

on:
  push:
    branches:
      - main
      - dev
  pull_request:
    branches:
      - main
      - dev

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up Temurin JDK
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 25
          cache: gradle

      - name: Log system & Java info (drift detection)
        run: |
          echo "=== Environment Info ==="
          uname -a
          echo "=== Java Version ==="
          java -version
          echo "=== Gradle Version ==="
          ./gradlew --version

      - name: Build application
        run: ./gradlew build shadowJar --no-daemon

      - name: Publish snapshot JAR
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
          BRANCH: ${{ github.ref_name }}
        run: |
          TAG="snapshot-${BRANCH}"
          cp build/libs/*-all.jar build/libs/brief.jar
          gh release create "$TAG" \
            --title "Snapshot (${BRANCH})" \
            --prerelease \
            --notes "Latest build from \`${BRANCH}\`. Updated automatically on every push." \
            2>/dev/null || true
          gh release upload "$TAG" build/libs/brief.jar --clobber
